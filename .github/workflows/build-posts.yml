name: 生成文章列表

# 你只管把 word 传进 Content/Posts/<抽屉>/<分组>/，
# 这里会自动把它转成网页、重排按钮，然后把结果提交回去。

on:
  push:
    branches: [main]
    paths:
      - "Content/Posts/**"
      - "tools/build_posts.py"
      - ".github/workflows/build-posts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成清单
        run: python tools/build_posts.py

      - name: 把结果提交回去
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Content/Posts
          if git diff --cached --quiet; then
            echo "没有变化，不提交"
          else
            git commit -m "自动生成文章列表 [skip ci]"
            git push
          fi
